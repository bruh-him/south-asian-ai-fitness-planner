[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "south-asian-ai-fitness-planner"
version = "0.1.0"
description = "South Asian nutrition and hypertrophy planning architecture inspired by a LangGraph fitness-planner reference implementation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project Contributors"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
